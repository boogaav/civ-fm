<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relief — CIV FM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏔️</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.css">
<style>
  :root {
    --space: #0b0b0d;
    --glass: rgba(28, 28, 30, .66);
    --glass-2: rgba(255, 255, 255, .06);
    --active: rgba(255, 255, 255, .14);
    --hairline: rgba(255, 255, 255, .1);
    --ink: #f5f5f7;
    --muted: #98989d;
    --accent: #0a84ff;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", sans-serif;
  }
  body.light {
    --space: #e9eef2;
    --glass: rgba(255, 255, 255, .72);
    --glass-2: rgba(0, 0, 0, .05);
    --active: rgba(0, 0, 0, .1);
    --hairline: rgba(0, 0, 0, .12);
    --ink: #1d1d1f;
    --muted: #6e6e73;
    --accent: #007aff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--space); color: var(--ink); font-family: var(--font); overflow: hidden; }
  #map { position: absolute; inset: 0; }
  .maplibregl-ctrl-attrib { background: rgba(127,127,127,.25) !important; font-size: 9px; }
  .maplibregl-canvas { outline: none; }

  header { position: absolute; top: 20px; left: 24px; z-index: 10; pointer-events: none; }
  .title { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
  .sub { font-size: 12px; color: var(--muted); }
  .back { pointer-events: auto; display: inline-block; margin-top: 10px;
    font: 500 12px var(--font); color: var(--accent); text-decoration: none; }
  .back:hover { text-decoration: underline; }

  .glass {
    background: var(--glass); border: 1px solid var(--hairline); border-radius: 12px;
    backdrop-filter: blur(24px) saturate(1.4);
    -webkit-backdrop-filter: blur(24px) saturate(1.4);
    box-shadow: 0 8px 32px rgba(0,0,0,.25);
  }

  #controls {
    position: absolute; top: 20px; right: 24px; z-index: 10;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
  }
  .seg { display: flex; gap: 3px; padding: 3px; }
  .seg button {
    appearance: none; background: none; border: none; cursor: pointer;
    font: 600 13px var(--font); color: var(--muted); padding: 5px 12px; border-radius: 8px;
  }
  .seg button:hover { color: var(--ink); background: var(--glass-2); }
  .seg button.active { background: var(--active); color: var(--ink); }
  .seg .lbl { font: 500 11px var(--font); color: var(--muted); align-self: center; padding: 0 4px 0 8px; }

  #places {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 18px; z-index: 10;
    display: flex; gap: 3px; padding: 4px; max-width: calc(100% - 48px); overflow-x: auto;
  }
  #places button {
    appearance: none; background: none; border: none; cursor: pointer; white-space: nowrap;
    font: 600 13px var(--font); color: var(--muted); padding: 7px 14px; border-radius: 9px;
  }
  #places button:hover { color: var(--ink); background: var(--glass-2); }
  #places button.active { background: var(--active); color: var(--ink); }

  /* sea-level rise bar */
  #searise {
    position: absolute; right: 24px; top: 50%; transform: translateY(-50%);
    z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 10px 8px;
  }
  #searise .lbl {
    font: 600 10px var(--font); letter-spacing: .12em; color: var(--muted);
  }
  #searise input[type="range"] {
    writing-mode: vertical-lr; direction: rtl;
    width: 20px; height: 150px;
    accent-color: #4da3ff;
    cursor: ns-resize;
  }
  #searise .val {
    font: 700 12px var(--font); color: var(--ink);
    font-variant-numeric: tabular-nums; min-width: 44px; text-align: center;
  }
  #searise .val.active { color: #4da3ff; }
  @media (max-width: 640px) { #searise { right: 12px; } }

  /* hazards panel */
  #hazards {
    position: absolute; left: 24px; top: 108px; z-index: 10;
    width: 300px; max-height: calc(100% - 108px - 150px); overflow-y: auto;
    padding: 12px 14px; font-size: 12.5px; line-height: 1.4;
  }
  .hz-head { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 4px; }
  #hz-close { all: unset; cursor: pointer; font-size: 20px; line-height: 1; color: var(--muted); padding: 0 4px; }
  #hz-close:hover { color: var(--ink); }
  #hz-close:focus-visible, .hz-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hz-note { color: var(--muted); font-size: 11.5px; }
  .hz-note b { color: var(--ink); font-weight: 600; }
  .hz-row { border-top: 1px solid var(--hairline); margin-top: 10px; padding-top: 9px; }
  .hz-row.off > :not(.hz-toggle) { display: none; }
  .hz-row.off .hz-toggle { opacity: .5; }
  .hz-toggle {
    all: unset; cursor: pointer; display: flex; align-items: baseline; gap: 7px; width: 100%;
    font: 600 13px var(--font); color: var(--ink); margin-bottom: 3px;
  }
  .hz-toggle i { width: 9px; height: 9px; border-radius: 50%; flex: none; align-self: center; }
  .hz-toggle small { font-weight: 400; font-size: 11px; color: var(--muted); }
  .hz-nums { font-variant-numeric: tabular-nums; }
  .hz-nums b { font-size: 17px; font-weight: 700; }
  .hz-nums span { color: var(--muted); margin-left: 6px; }
  .hz-bars { display: flex; align-items: flex-end; gap: 3px; height: 30px; margin-top: 6px; }
  .hz-bars i { flex: 1; border-radius: 2px 2px 0 0; min-height: 2px; }
  .hz-bars i.na { height: 2px; background: transparent; border-bottom: 2px dotted var(--hairline); }
  .hz-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin: 2px 0 4px; font-variant-numeric: tabular-nums; }
  .hz-key { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--hairline); font-size: 11px; color: var(--muted); }
  .hz-key i { width: 14px; height: 3px; border-radius: 2px; margin-left: 6px; }
  .hz-key i:first-child { margin-left: 0; }
  .hz-foot { margin-top: 8px; font-size: 10.5px; color: var(--muted); opacity: .85; }
  .maplibregl-popup-content {
    background: var(--glass) !important; color: var(--ink) !important;
    border: 1px solid var(--hairline); border-radius: 10px;
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    font: 12px/1.4 var(--font); padding: 8px 11px !important;
  }
  .maplibregl-popup-tip { display: none; }
  @media (max-width: 640px) {
    /* phones: the panel becomes a sheet above the place chips */
    #hazards { left: 12px; right: 12px; top: auto; bottom: 70px; width: auto; max-height: 44vh; }
    body.hz-on #readout, body.hz-on #searise { display: none !important; }
  }

  #readout {
    position: absolute; left: 24px; bottom: 78px; z-index: 10;
    padding: 10px 14px; font-size: 13px; display: none;
  }
  #readout .ev { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #readout .co { font-size: 11px; color: var(--muted); margin-top: 1px; }
  #hint {
    position: absolute; left: 24px; bottom: 78px; z-index: 10;
    padding: 8px 12px; font-size: 11.5px; color: var(--muted);
  }
  @media (max-width: 640px) { #hint { display: none; } }
</style>
</head>
<body>

<div id="map"></div>

<header>
  <div class="title">Relief</div>
  <div class="sub">the actual shape of the planet</div>
  <a class="back" href="../">← CIV FM</a>
</header>

<div id="controls">
  <div class="seg glass" id="theme">
    <span class="lbl">Style</span>
    <button data-t="dark" class="active">Dark</button>
    <button data-t="nature">Nature</button>
    <button data-t="satellite">Satellite</button>
  </div>
  <div class="seg glass" id="exag">
    <span class="lbl">Height</span>
    <button data-x="1">1×</button>
    <button data-x="1.5" class="active">1.5×</button>
    <button data-x="2.5">2.5×</button>
  </div>
  <div class="seg glass">
    <button id="btn-borders" aria-pressed="false">Borders</button>
    <button id="btn-hazards" aria-pressed="false" title="Typhoons, floods, earthquakes and eruptions that have hit this region">Hazards</button>
  </div>
</div>

<aside id="hazards" class="glass" hidden aria-label="Natural hazards in this region"></aside>

<div id="hint" class="glass">Drag to pan · right-drag or two fingers to tilt · click for elevation</div>

<div id="searise" class="glass" title="Raise the sea and watch what drowns">
  <span class="lbl">SEA</span>
  <input type="range" id="searise-input" min="0" max="100" step="1" value="0" aria-label="Sea level rise, meters">
  <span class="val" id="searise-val">+0 m</span>
</div>

<div id="readout" class="glass">
  <div class="ev"></div>
  <div class="co"></div>
</div>

<div id="places" class="glass"></div>

<script src="https://unpkg.com/maplibre-gl@5.7.0/dist/maplibre-gl.js"></script>
<script>
const PLACES = [
  { name: "Everest",       c: [86.925, 27.90], z: 10.8, p: 68, b: 340 },
  { name: "Matterhorn",    c: [7.658, 45.999],  z: 12.4, p: 74, b: 195 },
  { name: "Grand Canyon",  c: [-112.14, 36.20], z: 11.8, p: 68, b: 30 },
  { name: "Fuji",          c: [138.731, 35.42], z: 11.3, p: 66, b: 180 },
  { name: "Fitz Roy",      c: [-73.02, -49.32], z: 11.9, p: 70, b: 290 },
  { name: "Kilimanjaro",   c: [37.355, -3.13],  z: 11.2, p: 62, b: 350 },
  { name: "Geirangerfjord",c: [7.09, 62.12],    z: 11.6, p: 70, b: 60 },
  { name: "Table Mountain",c: [18.405, -34.02], z: 12.2, p: 68, b: 340 },
];

const DEM_TILES = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png";

// hypsometric tints + bathymetry (terrarium tiles carry ocean depth)
const NATURE_RELIEF = [
  -6000, "#16354f",
  -2000, "#2a5578",
  -200,  "#4d83ab",
  0,     "#79aac8",
  1,     "#8fbc85",
  250,   "#a6c98b",
  600,   "#c2cf8e",
  1200,  "#d8c885",
  2000,  "#c0a06b",
  3000,  "#9c7a55",
  4000,  "#8a7466",
  5000,  "#cfc8c0",
  6000,  "#ffffff",
];

const THEMES = {
  dark: {
    style: "https://basemaps.cartocdn.com/gl/dark-matter-nolabels-gl-style/style.json",
    hillshade: {
      "hillshade-shadow-color": "#05070a",
      "hillshade-highlight-color": "#c8d8e8",
      "hillshade-accent-color": "#22303f",
      "hillshade-exaggeration": 0.55,
    },
    sky: {
      "sky-color": "#0b0b0d",
      "horizon-color": "#16202c",
      "fog-color": "#0d141d",
      "sky-horizon-blend": 0.6,
      "horizon-fog-blend": 0.6,
    },
    colorRelief: null, // monochrome sculpture
  },
  nature: {
    style: "https://basemaps.cartocdn.com/gl/positron-nolabels-gl-style/style.json",
    hillshade: {
      "hillshade-shadow-color": "#4a3b28",
      "hillshade-highlight-color": "#ffffff",
      "hillshade-accent-color": "#5e6b52",
      "hillshade-exaggeration": 0.5,
    },
    sky: {
      "sky-color": "#a8cdf0",
      "horizon-color": "#e6f0f8",
      "fog-color": "#edf3f7",
      "sky-horizon-blend": 0.7,
      "horizon-fog-blend": 0.6,
    },
    colorRelief: NATURE_RELIEF,
  },
  satellite: {
    style: null, // built lazily by getSatelliteStyle()
    hillshade: null, // real imagery carries its own shading
    sky: {
      "sky-color": "#8ec1ec",
      "horizon-color": "#dcebf7",
      "fog-color": "#e6eef5",
      "sky-horizon-blend": 0.7,
      "horizon-fog-blend": 0.6,
    },
    colorRelief: null,
  },
};

// The basemaps ship these boundary layers, painted almost invisibly — the
// Borders toggle restyles them and lifts them above the terrain layers.
// Only the country line is drawn: the basemap's wide "outline" halo and its
// overlapping state lines both muddy it against busy terrain, and county lines
// are pure clutter at mountain zoom. Legibility comes from colour instead —
// white loses against snow, so each theme takes a hue that contrasts with its
// own relief palette.
const BORDER_LAYERS = ["boundary_country_inner"];
const HIDE_LAYERS = ["boundary_county", "boundary_state", "boundary_country_outline"];
const BORDER_PAINT = {
  dark:      { country: "#ff9f0a" },
  nature:    { country: "#c0392b" },
  satellite: { country: "#ffd60a" },
};

// Satellite style is raster-only, so it carries no boundary layers of its own.
// Build it lazily: Esri World Imagery tiles + the Carto vector source lifted
// from the dark style, with one line layer named "boundary_country_inner" so
// the Borders toggle works identically across all three styles.
let satStylePromise = null;
function getSatelliteStyle() {
  return (satStylePromise ??= (async () => {
    let cartoSource = null;
    try {
      cartoSource = (await (await fetch(THEMES.dark.style)).json()).sources.carto;
    } catch (e) { /* imagery still works, borders just unavailable */ }
    return {
      version: 8,
      sources: {
        sat: {
          type: "raster",
          tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],
          tileSize: 256,
          maxzoom: 19,
          attribution: "Imagery: Esri, Maxar, Earthstar Geographics",
        },
        ...(cartoSource ? { carto: cartoSource } : {}),
      },
      layers: [
        { id: "sat", type: "raster", source: "sat" },
        ...(cartoSource ? [{
          id: "boundary_country_inner",
          type: "line",
          source: "carto",
          "source-layer": "boundary",
          filter: ["all", ["==", "admin_level", 2], ["==", "maritime", 0]],
          layout: { visibility: "none" },
          paint: { "line-color": "#ffd60a", "line-width": 3 },
        }] : []),
      ],
    };
  })());
}

const styleFor = (t) =>
  t === "satellite" ? getSatelliteStyle() : Promise.resolve(THEMES[t].style);

let theme = "dark";
let exaggeration = 1.5;
let bordersOn = false;

function applyBorders() {
  // county lines are noise at mountain zoom; the halo masks the border line
  for (const id of HIDE_LAYERS)
    if (map.getLayer(id)) map.setLayoutProperty(id, "visibility", "none");

  const vis = bordersOn ? "visible" : "none";
  for (const id of BORDER_LAYERS) {
    if (!map.getLayer(id)) continue;
    map.setLayoutProperty(id, "visibility", vis);
    if (bordersOn) map.moveLayer(id); // draw above color-relief + hillshade
  }
  if (!bordersOn) return;

  const p = BORDER_PAINT[theme];
  // Solid, not dashed: terrain draping renders line dashes so faintly they
  // effectively disappear, and thin lines wash out in the drape texture.
  if (map.getLayer("boundary_country_inner")) {
    map.setPaintProperty("boundary_country_inner", "line-color", p.country);
    map.setPaintProperty("boundary_country_inner", "line-opacity", 1);
    map.setPaintProperty("boundary_country_inner", "line-dasharray", null);
    map.setPaintProperty("boundary_country_inner", "line-width",
      ["interpolate", ["linear"], ["zoom"], 3, 2.5, 8, 5, 13, 7]);
  }
  map.triggerRepaint();
}

const start = PLACES[0];
const map = new maplibregl.Map({
  container: "map",
  style: THEMES.dark.style,
  center: start.c,
  zoom: start.z,
  pitch: start.p,
  bearing: start.b,
  maxPitch: 80,
  attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-right");
new ResizeObserver(() => map.resize()).observe(document.getElementById("map"));

// re-applied after every setStyle (style.load fires each time)
function setupTerrain() {
  const t = THEMES[theme];
  const dem = {
    type: "raster-dem",
    encoding: "terrarium",
    tiles: [DEM_TILES],
    tileSize: 256,
    maxzoom: 15,
    attribution: "Terrain: Mapzen via AWS Open Data",
  };
  if (!map.getSource("dem")) map.addSource("dem", dem);
  if (!map.getSource("dem-hs")) map.addSource("dem-hs", { ...dem });
  map.setTerrain({ source: "dem", exaggeration });

  if (t.colorRelief && !map.getLayer("relief-color")) {
    try {
      map.addLayer({
        id: "relief-color",
        type: "color-relief",
        source: "dem-hs",
        paint: {
          "color-relief-color": ["interpolate", ["linear"], ["elevation"], ...t.colorRelief],
          "color-relief-opacity": 1,
        },
      });
    } catch (e) { /* color-relief unavailable — basemap + hillshade still work */ }
  }
  if (t.hillshade && !map.getLayer("hillshade")) {
    map.addLayer({ id: "hillshade", type: "hillshade", source: "dem-hs", paint: t.hillshade });
  }
  try { map.setSky(t.sky); } catch (e) {}
  applyFlood();
  applyBorders();
  hzDraw();
}

/* ---- sea-level rise: flood everything below the chosen height ---- */

let seaRise = 0;
const FLOOD_RGB = { dark: "77,163,255", nature: "45,120,190", satellite: "56,150,220" };

function applyFlood() {
  const has = map.getLayer("flood");
  if (seaRise < 1) {
    if (has) map.setLayoutProperty("flood", "visibility", "none");
    return;
  }
  const rgb = FLOOD_RGB[theme] || FLOOD_RGB.dark;
  const ramp = [
    "interpolate", ["linear"], ["elevation"],
    -11000, `rgba(${rgb},0)`,
    -1, `rgba(${rgb},0)`,      // existing ocean stays the basemap's
    0, `rgba(${rgb},1)`,       // newly drowned land lights up
    seaRise, `rgba(${rgb},1)`,
    seaRise + 1, `rgba(${rgb},0)`,
  ];
  if (!has) {
    try {
      map.addLayer({
        id: "flood", type: "color-relief", source: "dem-hs",
        paint: { "color-relief-color": ramp, "color-relief-opacity": 0.55 },
      });
      applyBorders(); // keep border lines above the water
    } catch (e) {}
  } else {
    map.setLayoutProperty("flood", "visibility", "visible");
    map.setPaintProperty("flood", "color-relief-color", ramp);
  }
}

const seaVal = document.getElementById("searise-val");
let floodPending = null;
document.getElementById("searise-input").addEventListener("input", (e) => {
  seaRise = Number(e.target.value);
  seaVal.textContent = `+${seaRise} m`;
  seaVal.classList.toggle("active", seaRise > 0);
  if (floodPending) return;
  floodPending = setTimeout(() => { floodPending = null; applyFlood(); }, 120);
});
map.on("style.load", setupTerrain);

/* borders toggle */
const btnBorders = document.getElementById("btn-borders");
btnBorders.addEventListener("click", () => {
  bordersOn = !bordersOn;
  btnBorders.classList.toggle("active", bordersOn);
  btnBorders.setAttribute("aria-pressed", String(bordersOn));
  applyBorders();
});

/* theme control */
document.querySelectorAll("#theme button").forEach((b) =>
  b.addEventListener("click", async () => {
    if (theme === b.dataset.t) return;
    theme = b.dataset.t;
    document.querySelectorAll("#theme button").forEach((x) => x.classList.toggle("active", x === b));
    document.body.classList.toggle("light", theme === "nature");
    map.setStyle(await styleFor(theme)); // style.load re-runs setupTerrain
  })
);

/* exaggeration control */
document.querySelectorAll("#exag button").forEach((b) =>
  b.addEventListener("click", () => {
    exaggeration = Number(b.dataset.x);
    document.querySelectorAll("#exag button").forEach((x) => x.classList.toggle("active", x === b));
    map.setTerrain({ source: "dem", exaggeration });
  })
);

/* ---- hazards: what has actually hit this region, and how often ---- */
// Past events from open archives, drawn on the terrain and counted per year:
//   tropical cyclones + eruptions — NASA EONET (browser-readable, storm tracks included)
//   earthquakes M5.5+            — USGS
//   floods                       — GDACS archive via the civfm-proxy Worker
// Counted inside a box around the map centre (outlined on the map), since a
// pitched 3D view has no honest "what's on screen" rectangle.

const PROXY = "https://civfm-proxy.boogaav.workers.dev";
const HZ_TYPES = {
  storms:    { label: "Tropical cyclones", sub: "typhoons · hurricanes", color: "#ff9f0a", since: 2016 },
  // GDACS logged ~100 floods a year before 2019 and ~600 since 2021: the jump
  // is reporting, not weather, so flood counts only start where it is steady
  floods:    { label: "Floods", sub: "GDACS alerts", color: "#4da3ff", since: 2020 },
  quakes:    { label: "Earthquakes", sub: "magnitude 5.5+", color: "#bf5af2", since: 2016 },
  volcanoes: { label: "Volcanic eruptions", sub: "", color: "#ff453a", since: 2016 },
};
const HZ_FIRST_YEAR = 2016;
const HZ = { on: false, seq: 0, key: null, region: null, data: null, hidden: new Set(), floodBase: null, floodLive: null, popup: null };

const hzClamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hzMonth = (iso) => new Date(iso).toLocaleDateString("en", { month: "short", year: "numeric", timeZone: "UTC" });

function hzRegion() {
  const c = map.getCenter(), cv = map.getCanvas();
  const degPerPx = 360 / (512 * Math.pow(2, map.getZoom()));
  const halfLon = hzClamp((cv.clientWidth / 2) * degPerPx, 2.5, 22);
  const halfLat = hzClamp((cv.clientHeight / 2) * degPerPx * Math.cos((c.lat * Math.PI) / 180), 2, 18);
  const snap = (v) => Math.round(v * 2) / 2; // half-degree grid, so small pans reuse the last answer
  const w = hzClamp(snap(c.lng - halfLon), -180, 180), e = hzClamp(snap(c.lng + halfLon), -180, 180);
  const s = hzClamp(snap(c.lat - halfLat), -85, 85), n = hzClamp(snap(c.lat + halfLat), -85, 85);
  const midLat = (s + n) / 2;
  return {
    w, e, s, n, key: `${w},${s},${e},${n}`,
    km: [Math.round(((e - w) * 111 * Math.cos((midLat * Math.PI) / 180)) / 50) * 50, Math.round(((n - s) * 111) / 50) * 50],
  };
}

async function hzJSON(url, ms = 30000) {
  const r = await fetch(url, { signal: AbortSignal.timeout(ms) });
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}

// Floods: past years never change, so they ship as a static file baked by
// relief/build_floods.py. The Worker is asked only for what happened since the
// bake (one request per year since, usually one) — crawling the whole archive
// per visit meant ~40 simultaneous GDACS requests, and GDACS stalls under that.
function hzFloodsBase() {
  return (HZ.floodBase ??= hzJSON("floods.json", 30000).catch((e) => { HZ.floodBase = null; throw e; }));
}
function hzFloodsLive(base) {
  return (HZ.floodLive ??= (async () => {
    const out = [];
    for (let y = +base.baked.slice(0, 4); y <= new Date().getUTCFullYear(); y++) {
      const d = await hzJSON(`${PROXY}/floods?year=${y}`, 25000);
      out.push(...(d.floods || []));
    }
    return out;
  })().catch((e) => { HZ.floodLive = null; throw e; }));
}

async function hzLoad(force) {
  if (!HZ.on) return;
  const r = hzRegion();
  if (!force && r.key === HZ.key) return;
  HZ.key = r.key; HZ.region = r;
  const seq = ++HZ.seq;
  const yearAgo = Date.now() - 365 * 864e5;
  const start = `${HZ_FIRST_YEAR}-01-01`;
  // null = still loading; a key in `failed` = that source did not answer
  const data = (HZ.data = { storms: null, volcanoes: null, quakes: null, floods: null, failed: {}, floodsThrough: null });
  const mark = (list) => { for (const ev of list) ev.recent = Date.parse(ev.end || ev.date) >= yearAgo ? 1 : 0; return list; };
  // each source lands on its own — a slow feed never holds the others back
  const show = () => { if (seq === HZ.seq) { hzDraw(); hzPanel(); } };
  const live = () => seq === HZ.seq;
  show();

  hzJSON(`https://eonet.gsfc.nasa.gov/api/v3/events?status=all&category=severeStorms,volcanoes&bbox=${r.w},${r.n},${r.e},${r.s}&start=${start}&end=${new Date().getUTCFullYear()}-12-31`) // EONET ignores start without end
    .then((eo) => {
      if (!live()) return;
      const storms = [], volcanoes = [];
      for (const ev of eo.events || []) {
        const pts = (ev.geometry || []).filter((g) => g.type === "Point" && g.coordinates);
        if (!pts.length) continue;
        pts.sort((a, b) => a.date.localeCompare(b.date));
        if (pts[0].date < start) continue; // only draw what the panel counts
        const cat = ev.categories?.[0]?.id;
        if (cat === "severeStorms") {
          const kts = Math.max(0, ...pts.map((p) => (p.magnitudeUnit === "kts" ? p.magnitudeValue || 0 : 0)));
          // Break the track at the antimeridian and wherever the storm would have
          // had to move faster than ~65 km/h: the feed carries the odd bad fix
          // (a longitude with the wrong sign puts an East Pacific storm in Asia).
          const lines = [[]];
          let prev = null;
          for (const p of pts) {
            if (prev) {
              const hrs = Math.max(1, (Date.parse(p.date) - Date.parse(prev.date)) / 36e5);
              const dx = Math.abs(p.coordinates[0] - prev.coordinates[0]);
              const far = Math.hypot(Math.min(dx, 360 - dx), p.coordinates[1] - prev.coordinates[1]) / hrs > 0.6;
              if (dx > 180 || far) lines.push([]);
            }
            lines[lines.length - 1].push(p.coordinates);
            prev = p;
          }
          const kept = lines.filter((l) => l.length > 1);
          // a storm that only "entered" the region through a bad fix was never here
          if (!kept.some((l) => l.some(([x, y]) => x >= r.w - 1 && x <= r.e + 1 && y >= r.s - 1 && y <= r.n + 1))) continue;
          storms.push({
            title: ev.title, date: pts[0].date, end: pts[pts.length - 1].date, kts,
            cls: kts >= 96 ? 3 : kts >= 64 ? 2 : kts >= 34 ? 1 : 0,
            lines: kept,
          });
        } else if (cat === "volcanoes") {
          volcanoes.push({ title: ev.title, date: pts[0].date, end: pts[pts.length - 1].date, at: pts[0].coordinates });
        }
      }
      data.storms = mark(storms); data.volcanoes = mark(volcanoes);
    })
    .catch(() => { data.failed.storms = data.failed.volcanoes = true; })
    .finally(show);

  hzJSON(`https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=${start}&minmagnitude=5.5&minlatitude=${r.s}&maxlatitude=${r.n}&minlongitude=${r.w}&maxlongitude=${r.e}&orderby=time&limit=2000`)
    .then((qk) => {
      data.quakes = mark((qk.features || []).map((f) => ({
        title: f.properties.place || "Earthquake", mag: f.properties.mag,
        date: new Date(f.properties.time).toISOString(), at: f.geometry.coordinates.slice(0, 2),
      })));
    })
    .catch(() => { data.failed.quakes = true; })
    .finally(show);

  const inBox = (rows) => {
    const seen = new Set(), out = [];
    for (const f of rows) {
      if (f[0] < r.w || f[0] > r.e || f[1] < r.s || f[1] > r.n) continue;
      const k = f[0] + "," + f[1] + "," + f[2];
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ title: `Flood · ${f[4] || "unnamed"}`, date: f[2] + "T00:00:00Z", level: f[3], at: [f[0], f[1]] });
    }
    return mark(out);
  };
  hzFloodsBase()
    .then((base) => {
      if (!live()) return;
      data.floods = inBox(base.floods);
      data.floodsThrough = base.baked; // until the live top-up lands
      show();
      return hzFloodsLive(base).then((extra) => {
        if (!live()) return;
        data.floods = inBox(base.floods.concat(extra));
        data.floodsThrough = null;
      }).catch(() => {}); // the static archive already answered; just stay dated
    })
    .catch(() => { data.failed.floods = true; })
    .finally(show);
}

const HZ_LAYERS = ["hz-box", "hz-storms", "hz-floods", "hz-quakes", "hz-volcanoes"];

function hzClear() {
  for (const id of HZ_LAYERS) {
    if (map.getLayer(id)) map.removeLayer(id);
    if (map.getSource(id)) map.removeSource(id);
  }
  HZ.popup?.remove();
}

// also called from setupTerrain, because setStyle throws every layer away
function hzDraw() {
  hzClear();
  if (!HZ.on || !HZ.data || !HZ.region) return;
  const d = HZ.data, r = HZ.region;
  const fc = (features) => ({ type: "FeatureCollection", features });
  const light = theme === "nature";
  const fade = ["case", ["==", ["get", "recent"], 1], 0.95, 0.45]; // the last 12 months stand out
  const vis = (k) => (HZ.hidden.has(k) ? "none" : "visible");

  map.addSource("hz-box", { type: "geojson", data: { type: "Feature", properties: {}, geometry: { type: "LineString",
    coordinates: [[r.w, r.s], [r.e, r.s], [r.e, r.n], [r.w, r.n], [r.w, r.s]] } } });
  map.addLayer({ id: "hz-box", type: "line", source: "hz-box",
    paint: { "line-color": light ? "#1d1d1f" : "#f5f5f7", "line-width": 1, "line-opacity": 0.35 } });

  map.addSource("hz-storms", { type: "geojson", data: fc((d.storms || []).flatMap((s) => s.lines.map((l) => ({
    type: "Feature", geometry: { type: "LineString", coordinates: l },
    properties: { kind: "storms", title: s.title, date: s.date, kts: s.kts, cls: s.cls, recent: s.recent } })))) });
  map.addLayer({ id: "hz-storms", type: "line", source: "hz-storms",
    layout: { "line-cap": "round", "line-join": "round", visibility: vis("storms") },
    paint: {
      "line-color": ["match", ["get", "cls"], 3, "#ff2d55", 2, "#ff6b3a", 1, "#ffb340", "#c9a25a"],
      "line-width": ["match", ["get", "cls"], 3, 3.2, 2, 2.4, 1, 1.6, 1.1],
      "line-opacity": fade,
    } });

  const point = (kind, list, extra) => fc((list || []).map((e) => ({
    type: "Feature", geometry: { type: "Point", coordinates: e.at },
    properties: { kind, title: e.title, date: e.date, recent: e.recent, ...extra(e) } })));
  const stroke = { "circle-stroke-color": light ? "#ffffff" : "#0b0b0d", "circle-stroke-width": 1, "circle-stroke-opacity": 0.7 };

  map.addSource("hz-floods", { type: "geojson", data: point("floods", d.floods, (e) => ({ level: e.level })) });
  map.addLayer({ id: "hz-floods", type: "circle", source: "hz-floods", layout: { visibility: vis("floods") },
    paint: { "circle-color": "#4da3ff", "circle-radius": ["match", ["get", "level"], 2, 9, 1, 6.5, 4], "circle-opacity": fade, ...stroke } });

  map.addSource("hz-quakes", { type: "geojson", data: point("quakes", d.quakes, (e) => ({ mag: e.mag })) });
  map.addLayer({ id: "hz-quakes", type: "circle", source: "hz-quakes", layout: { visibility: vis("quakes") },
    paint: { "circle-color": "#bf5af2", "circle-radius": ["interpolate", ["linear"], ["get", "mag"], 5.5, 3.5, 7, 8, 9, 17], "circle-opacity": fade, ...stroke } });

  map.addSource("hz-volcanoes", { type: "geojson", data: point("volcanoes", d.volcanoes, () => ({})) });
  map.addLayer({ id: "hz-volcanoes", type: "circle", source: "hz-volcanoes", layout: { visibility: vis("volcanoes") },
    paint: { "circle-color": "#ff453a", "circle-radius": 6, "circle-opacity": fade, ...stroke } });
}

function hzStats(list, since) {
  const thisYear = new Date().getUTCFullYear();
  const years = [];
  for (let y = HZ_FIRST_YEAR; y <= thisYear; y++) years.push({ y, n: y < since ? null : 0 });
  let total = 0, latest = null;
  for (const e of list) {
    const y = +e.date.slice(0, 4);
    if (y < since || y > thisYear) continue;
    years[y - HZ_FIRST_YEAR].n++; total++;
    if (!latest || e.date > latest.date) latest = e;
  }
  // per-year rate over the elapsed part of the window, so a half-finished year doesn't drag it down
  const now = new Date();
  const span = thisYear - since + (now - Date.UTC(thisYear, 0, 1)) / (365.25 * 864e5);
  return { years, total, latest, recent: list.filter((e) => e.recent && +e.date.slice(0, 4) >= since).length, perYear: total / span };
}

function hzPanel() {
  const el = document.getElementById("hazards");
  if (!HZ.on) { el.hidden = true; return; }
  el.hidden = false;
  const r = HZ.region, d = HZ.data, thisYear = new Date().getUTCFullYear();
  const rows = Object.entries(HZ_TYPES).map(([k, t]) => {
    const list = d && d[k];
    let body;
    if (d && d.failed[k]) body = `<div class="hz-note">Unavailable right now.</div>`;
    else if (!list) body = `<div class="hz-note">Loading…</div>`;
    else {
      const s = hzStats(list, t.since);
      if (!s.total) body = `<div class="hz-note">None recorded here since ${t.since}.</div>`;
      else {
        const max = Math.max(1, ...s.years.map((y) => y.n || 0));
        const bars = s.years.map((y) =>
          y.n === null
            ? `<i class="na" title="${y.y}: not counted"></i>`
            : `<i style="height:${Math.max(y.n ? 12 : 3, Math.round((y.n / max) * 100))}%;background:${y.n ? t.color : "var(--hairline)"}${y.y === thisYear ? ";opacity:.55" : ""}" title="${y.y}${y.y === thisYear ? " so far" : ""}: ${y.n}"></i>`
        ).join("");
        const rate = s.perYear >= 10 ? Math.round(s.perYear) : s.perYear >= 1 ? s.perYear.toFixed(1) : "under 1";
        const extra = k === "storms" ? ` · ${list.filter((e) => e.cls >= 2 && +e.date.slice(0, 4) >= t.since).length} reached typhoon strength` : "";
        body =
          `<div class="hz-nums"><b>${s.total}</b> since ${t.since} <span>≈ ${rate} a year</span></div>` +
          `<div class="hz-bars" aria-hidden="true">${bars}</div>` +
          `<div class="hz-axis"><span>${HZ_FIRST_YEAR}</span><span>${thisYear}</span></div>` +
          `<div class="hz-note"><b>${s.recent}</b> in the last 12 months${extra}</div>` +
          (s.latest ? `<div class="hz-note">Latest: ${s.latest.title.replace(/</g, "&lt;")} · ${hzMonth(s.latest.date)}</div>` : "");
      }
    }
    const off = HZ.hidden.has(k);
    return `<section class="hz-row${off ? " off" : ""}">
      <button class="hz-toggle" data-k="${k}" aria-pressed="${!off}" title="Show or hide on the map">
        <i style="background:${t.color}"></i><span>${t.label}</span>${t.sub ? `<small>${t.sub}</small>` : ""}
      </button>${body}</section>`;
  }).join("");
  el.innerHTML =
    `<div class="hz-head"><b>Hazards here</b><button id="hz-close" aria-label="Close hazards">×</button></div>` +
    `<div class="hz-note">Past events inside the outlined area${r ? ` (about ${r.km[0].toLocaleString()} × ${r.km[1].toLocaleString()} km)` : ""}. Brighter marks are from the last 12 months.</div>` +
    rows +
    `<div class="hz-key"><i style="background:#ffb340"></i>storm<i style="background:#ff6b3a"></i>typhoon<i style="background:#ff2d55"></i>major typhoon</div>` +
    `<div class="hz-foot">A record of what happened, not a forecast. Cyclones and eruptions: NASA EONET. Earthquakes: USGS. Floods: GDACS, counted from 2020 because earlier years were thinly reported${d && d.floodsThrough ? `; shown through ${d.floodsThrough}` : ""}.</div>`;
  el.querySelector("#hz-close").onclick = () => hzToggle(false);
  el.querySelectorAll(".hz-toggle").forEach((b) => (b.onclick = () => {
    const k = b.dataset.k;
    HZ.hidden.has(k) ? HZ.hidden.delete(k) : HZ.hidden.add(k);
    if (map.getLayer("hz-" + k)) map.setLayoutProperty("hz-" + k, "visibility", HZ.hidden.has(k) ? "none" : "visible");
    map.triggerRepaint();
    hzPanel();
  }));
}

function hzToggle(on) {
  HZ.on = on;
  const btn = document.getElementById("btn-hazards");
  btn.classList.toggle("active", on);
  btn.setAttribute("aria-pressed", String(on));
  document.body.classList.toggle("hz-on", on);
  if (on) hzLoad(true);
  else { HZ.seq++; HZ.key = null; hzClear(); hzPanel(); }
}
document.getElementById("btn-hazards").addEventListener("click", () => hzToggle(!HZ.on));

let hzMoveT = null;
map.on("moveend", () => { clearTimeout(hzMoveT); if (HZ.on) hzMoveT = setTimeout(() => hzLoad(false), 700); });

// tap or click a mark for what it was
map.on("click", (e) => {
  if (!HZ.on) return;
  const layers = HZ_LAYERS.slice(1).filter((id) => map.getLayer(id));
  // where marks overlap, answer with the one a person most likely means:
  // a dot over a line, then recent over old, then the stronger event
  const rank = (f) => (f.layer.type === "circle" ? 1e4 : 0) + (f.properties.recent ? 1e3 : 0) +
    (f.properties.cls || 0) * 100 + (f.properties.level || 0) * 100 + (f.properties.mag || 0) * 10 +
    Date.parse(f.properties.date) / 1e12; // newest wins a tie
  const hit = map.queryRenderedFeatures([[e.point.x - 6, e.point.y - 6], [e.point.x + 6, e.point.y + 6]], { layers })
    .sort((a, b) => rank(b) - rank(a))[0];
  HZ.popup?.remove();
  if (!hit) return;
  const p = hit.properties, when = hzMonth(p.date);
  const line =
    p.kind === "storms" ? `${when}${p.kts ? ` · peak ${p.kts} kt (${Math.round(p.kts * 1.852)} km/h)` : ""}`
    : p.kind === "quakes" ? `${when} · magnitude ${Number(p.mag).toFixed(1)}`
    : p.kind === "floods" ? `${when} · ${["Green", "Orange", "Red"][p.level] || "Green"} alert`
    : when;
  HZ.popup = new maplibregl.Popup({ closeButton: false, offset: 10, maxWidth: "260px" })
    .setLngLat(e.lngLat)
    .setHTML(`<b>${String(p.title).replace(/</g, "&lt;")}</b><br>${line}`)
    .addTo(map);
});

/* place chips */
const placesEl = document.getElementById("places");
placesEl.innerHTML = PLACES.map(
  (p, i) => `<button data-i="${i}"${i === 0 ? ' class="active"' : ""}>${p.name}</button>`
).join("");
placesEl.querySelectorAll("button").forEach((b) =>
  b.addEventListener("click", () => {
    const p = PLACES[b.dataset.i];
    placesEl.querySelectorAll("button").forEach((x) => x.classList.toggle("active", x === b));
    map.flyTo({ center: p.c, zoom: p.z, pitch: p.p, bearing: p.b, duration: 3200 });
  })
);

/* click → elevation (queryTerrainElevation returns exaggerated meters) */
const readout = document.getElementById("readout");
map.on("click", (e) => {
  const ev = map.queryTerrainElevation(e.lngLat);
  if (ev == null) return;
  document.getElementById("hint").style.display = "none";
  readout.style.display = "block";
  readout.querySelector(".ev").textContent = `${Math.round(ev / exaggeration).toLocaleString()} m`;
  readout.querySelector(".co").textContent = `${e.lngLat.lat.toFixed(4)}, ${e.lngLat.lng.toFixed(4)}`;
});
</script>
</body>
